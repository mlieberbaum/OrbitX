name: Update OrbitX Header capital A

on:
  push:
    branches:
      - feature/ui-polish-01
    paths:
      - .github/workflows/update-orbitx-header-a.yml

jobs:
  update-capital-a:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-polish-01
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font editing and rendering libraries
        run: python -m pip install 'fonttools==4.59.2' 'pillow==11.3.0'
      - name: Add ONLY the approved crossbar to capital A
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from fontTools.pens.ttGlyphPen import TTGlyphPen
          from PIL import ImageFont

          path=Path('Runtime/Fonts/OrbitXHeader.ttf')
          assert path.is_file(), 'The approved bundled font was not found.'
          font=TTFont(path)
          assert font['name'].getDebugName(1)=='OrbitX Header'
          glyph_name=font.getBestCmap()[ord('A')]
          original=font['glyf'][glyph_name]
          assert original.numberOfContours==1, 'Unexpected capital A outline'
          assert font['head'].unitsPerEm==2048, 'Unexpected P11 font units'
          previous_metrics=dict(font['hmtx'].metrics)
          previous_cmap=dict(font.getBestCmap())
          previous_glyphs={}
          for ch in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789':
              name=previous_cmap[ord(ch)]
              glyph=font['glyf'][name]
              previous_glyphs[ch]=(tuple(tuple(p) for p in glyph.coordinates),
                                   tuple(glyph.flags),
                                   tuple(glyph.endPtsOfContours))
          old_cap=previous_glyphs['A']

          # P11 approved cap: seven straight-edge vertices. Preserve that contour
          # exactly; the short horizontal bar is the only new outline.
          scale=font['head'].unitsPerEm/1000
          def point(x,y):
              return (round((x-282+175)*scale),round(y*scale))
          expected=[(282,20),(382,20),(840,655),(1298,20),
                    (1398,20),(884,733),(796,733)]
          expected_vertices={point(x,y) for x,y in expected}
          assert set(old_cap[0])==expected_vertices, 'A is not the approved P11 geometry; stop rather than alter another font.'
          pen=TTGlyphPen(font['glyf'])
          original.draw(pen,font['glyf'])
          # Short, constant-weight crossbar near the lower third of the cap.
          # The two ends overlap only the existing diagonal strokes, not the
          # outside ink bounds. Matching clockwise winding avoids cutouts.
          left,right=550,1130
          bottom,top=278,354
          p=[point(left,bottom),point(left,top),point(right,top),point(right,bottom)]
          assert original.xMin<p[0][0]<p[2][0]<original.xMax
          assert original.yMin<p[0][1]<p[1][1]<original.yMax
          pen.moveTo(p[0])
          for pt in p[1:]: pen.lineTo(pt)
          pen.closePath()
          font['glyf'][glyph_name]=pen.glyph()
          assert font['hmtx'].metrics==previous_metrics, 'Font spacing changed'
          font.save(path)
          font.close()

          output=TTFont(path)
          assert output['name'].getDebugName(1)=='OrbitX Header'
          assert output.getBestCmap()==previous_cmap
          assert output['hmtx'].metrics==previous_metrics
          for ch,prev in previous_glyphs.items():
              name=previous_cmap[ord(ch)]
              g=output['glyf'][name]
              actual=(tuple(tuple(p) for p in g.coordinates),
                      tuple(g.flags),tuple(g.endPtsOfContours))
              if ch=='A':
                  assert g.numberOfContours==2, 'A does not contain the crossbar'
                  assert actual[0][:len(prev[0])]==prev[0], 'Original A diagonals changed'
                  assert actual[1][:len(prev[1])]==prev[1], 'Original A curve flags changed'
                  assert actual[0][len(prev[0]):]==tuple(p), 'Wrong A crossbar geometry'
              else:
                  assert actual==prev, f'Unexpected glyph geometry change for {ch}'
          output.close()
          ImageFont.truetype(str(path),128).getbbox('ORBITX HEADER A 0123456789')
          print('PASS: Only the capital A outline gained the crossbar.')
          print('PASS: All other A-Z, a-z, 0-9 glyph geometry and ALL character widths unchanged.')
          print('PASS: OrbitX Header family name and rendering test.')
          PY
      - name: Commit only the updated production TTF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Runtime/Fonts/OrbitXHeader.ttf
          git diff --cached --exit-code && { echo 'Expected font change missing'; exit 1; } || true
          git commit -m 'Add crossbar to OrbitX Header capital A'
          git push origin HEAD:refs/heads/feature/ui-polish-01
