name: Build OrbitX header font

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ui-polish-01
    paths:
      - .github/workflows/build-header-font.yml
      - tools/fonts/OrbitX_Header_Font_P7_Builder.py

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font-building dependencies
        run: |
          python -m pip install 'fonttools==4.59.2'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Check font builder sources
        run: |
          test -f tools/fonts/OrbitX_Header_Font_Builder.py
          test -f tools/fonts/OrbitX_Header_Font_P7_Builder.py
      - name: Build OrbitX Header Font P7
        run: python tools/fonts/OrbitX_Header_Font_P7_Builder.py
      - name: Verify TTF structure and coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          p=Path('tools/fonts/OrbitX_Header_Font_Prototype_7.ttf')
          assert p.is_file()
          f=TTFont(p)
          assert f['name'].getDebugName(1)=='OrbitX Header Font P7'
          assert f['OS/2'].fsType==0
          assert f['maxp'].numGlyphs>1000
          assert all(ord(ch) in f.getBestCmap() for ch in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789')
          f.close()
          print('P7 TTF verified. Word rendering still requires a Windows test.')
          PY
      - name: Publish downloadable TTF
        uses: actions/upload-artifact@v4
        with:
          name: OrbitX-Header-Font-P7-TTF
          path: tools/fonts/OrbitX_Header_Font_Prototype_7.ttf
          if-no-files-found: error
