name: Build OrbitX header font

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ui-polish-01
    paths:
      - .github/workflows/build-header-font.yml
      - tools/fonts/OrbitX_Header_Font_P9_Builder.py

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font-building dependencies
        run: |
          python -m pip install 'fonttools==4.59.2'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Check builder sources
        run: |
          test -f tools/fonts/OrbitX_Header_Font_Builder.py
          test -f tools/fonts/OrbitX_Header_Font_P8_Builder.py
          test -f tools/fonts/OrbitX_Header_Font_P9_Builder.py
      - name: Build OrbitX Header Font P9
        run: python tools/fonts/OrbitX_Header_Font_P9_Builder.py
      - name: Verify P9 TTF and unchanged P7/P8 spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          directory=Path('tools/fonts')
          p8=directory/'OrbitX_Header_Font_Prototype_8.ttf'
          p9=directory/'OrbitX_Header_Font_Prototype_9.ttf'
          assert p8.is_file() and p9.is_file(), 'Font builder did not generate both files'
          a,b=TTFont(p8),TTFont(p9)
          assert b['name'].getDebugName(1)=='OrbitX Header Font P9'
          assert b['OS/2'].fsType==0
          assert b['maxp'].numGlyphs>1000
          for ch in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789':
              assert ord(ch) in b.getBestCmap(), f'Missing {ch}'
              left=a.getBestCmap()[ord(ch)]
              right=b.getBestCmap()[ord(ch)]
              assert a['hmtx'][left]==b['hmtx'][right], f'Spacing changed for {ch}'
          for ch in 'AMNX':
              left=a.getBestCmap()[ord(ch)]
              right=b.getBestCmap()[ord(ch)]
              assert list(a['glyf'][left].coordinates)==list(b['glyf'][right].coordinates), f'Angular glyph {ch} changed'
          c0=a['glyf'][a.getBestCmap()[ord('C')]]
          c1=b['glyf'][b.getBestCmap()[ord('C')]]
          assert list(c0.coordinates)!=list(c1.coordinates), 'C corner radius did not change'
          a.close();b.close()
          print('P9 TTF valid. Curves enlarged; widths, bearings, and angular letters unchanged.')
          print('Microsoft Word rendering still requires a Windows test.')
          PY
      - name: Publish downloadable P9 TTF
        uses: actions/upload-artifact@v4
        with:
          name: OrbitX-Header-Font-P9-TTF
          path: tools/fonts/OrbitX_Header_Font_Prototype_9.ttf
          if-no-files-found: error
