name: Package OrbitX Header font for the application

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ui-polish-01
    paths:
      - .github/workflows/build-header-font.yml
      - tools/fonts/package_orbitx_header.py
      - tools/fonts/OrbitX_Header_Font_P11_Builder.py

concurrency:
  group: orbitx-header-asset-feature-ui-polish-01
  cancel-in-progress: false

jobs:
  package-font:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-polish-01
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font-generation dependencies
        run: |
          python -m pip install 'fonttools==4.59.2' 'pillow==11.3.0'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Build and rename approved P11 font
        run: python tools/fonts/package_orbitx_header.py
      - name: Verify install-free runtime asset
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from PIL import ImageFont

          root=Path('Runtime/Fonts')
          path=root/'OrbitXHeader.ttf'
          assert path.is_file(), 'Missing Runtime/Fonts/OrbitXHeader.ttf'
          assert (root/'FONT-LICENSE.txt').is_file(), 'Missing font redistribution notice'
          f=TTFont(path)
          names=f['name']
          assert names.getDebugName(1)=='OrbitX Header'
          assert names.getDebugName(4)=='OrbitX Header'
          assert names.getDebugName(6)=='OrbitXHeader-Regular'
          assert f['OS/2'].fsType==0
          assert all(ord(c) in f.getBestCmap()
                     for c in 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789')
          assert f['maxp'].numGlyphs > 1000
          f.close()
          ImageFont.truetype(str(path),32).getbbox('ORBITX 0123456789')
          print('Verified approved P11 font outlines, metrics, naming and runtime file.')
          print('Windows DirectWrite rendering requires a Windows runtime test.')
          PY
      - name: Commit finalized font asset to existing feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Runtime/Fonts/OrbitXHeader.ttf
          if git diff --cached --quiet; then
            echo "The exact font asset is already committed; no changes necessary."
          else
            git commit -m "Add OrbitX Header .ttf font for bundled UI rendering"
            git push origin HEAD:refs/heads/feature/ui-polish-01
          fi
