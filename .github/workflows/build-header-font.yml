name: Build OrbitX header font

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ui-polish-01
    paths:
      - tools/fonts/OrbitX_Header_Font_P5_Builder.py

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font-building dependencies
        run: |
          python -m pip install 'fonttools==4.59.2'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Check source files
        run: |
          test -f tools/fonts/OrbitX_Header_Font_Builder.py
          test -f tools/fonts/OrbitX_Header_Font_P5_Builder.py
      - name: Build Word-compatibility prototype 5
        run: python tools/fonts/OrbitX_Header_Font_P5_Builder.py
      - name: Validate new font
        run: |
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path
          p=Path('tools/fonts/OrbitX_Header_Font_Prototype_5.ttf')
          assert p.is_file()
          f=TTFont(p)
          assert f['name'].getDebugName(1)=='OrbitX Header Font P5'
          assert f['OS/2'].fsType == 0
          assert all(ord(c) in f.getBestCmap() for c in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789')
          assert f['maxp'].numGlyphs > 1000
          f.close()
          print('Font structure and character coverage verified. Microsoft Word rendering requires a Windows test.')
          PY
      - name: Publish Windows font
        uses: actions/upload-artifact@v4
        with:
          name: OrbitX-Header-Font-P5-TTF
          path: tools/fonts/OrbitX_Header_Font_Prototype_5.ttf
          if-no-files-found: error
