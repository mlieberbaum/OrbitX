name: Build OrbitX header font

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ui-polish-01
    paths:
      - .github/workflows/build-header-font.yml
      - tools/fonts/OrbitX_Header_Font_P11_Builder.py

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font-building dependencies
        run: |
          python -m pip install 'fonttools==4.59.2' 'pillow==11.3.0'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Check builder sources
        run: |
          test -f tools/fonts/OrbitX_Header_Font_Builder.py
          test -f tools/fonts/OrbitX_Header_Font_P8_Builder.py
          test -f tools/fonts/OrbitX_Header_Font_P10_Builder.py
          test -f tools/fonts/OrbitX_Header_Font_P11_Builder.py
      - name: Build OrbitX Header Font P11
        run: python tools/fonts/OrbitX_Header_Font_P11_Builder.py
      - name: Verify metrics and exactly the intended glyph changes
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from PIL import Image,ImageFont,ImageDraw

          root=Path('tools/fonts')
          a=TTFont(root/'OrbitX_Header_Font_Prototype_10.ttf')
          b=TTFont(root/'OrbitX_Header_Font_Prototype_11.ttf')
          assert b['name'].getDebugName(1)=='OrbitX Header Font P11'
          assert b['OS/2'].fsType==0
          assert b['maxp'].numGlyphs>1000
          changed=set('ABGJKQRSU038')
          for ch in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789':
              aa=a.getBestCmap().get(ord(ch))
              bb=b.getBestCmap().get(ord(ch))
              assert aa and bb, f'Missing character {ch}'
              assert a['hmtx'][aa]==b['hmtx'][bb], f'Spacing changed: {ch}'
              old=a['glyf'][aa];new=b['glyf'][bb]
              if ch not in changed:
                  assert list(old.coordinates)==list(new.coordinates),f'Unrequested glyph changed: {ch}'
                  assert list(old.flags)==list(new.flags),f'Unrequested glyph flags changed: {ch}'
              else:
                  assert (list(old.coordinates)!=list(new.coordinates) or list(old.flags)!=list(new.flags)),f'Edited glyph is identical to P10: {ch}'
          c=b.getBestCmap()
          assert b['glyf'][c[ord('0')]].numberOfContours>=3,'Slashed zero contour missing'
          assert b['glyf'][c[ord('B')]].numberOfContours==3,'B counters missing'
          assert b['glyf'][c[ord('8')]].numberOfContours==3,'8 counters missing'
          a.close();b.close()

          font=ImageFont.truetype(str(root/'OrbitX_Header_Font_Prototype_11.ttf'),75)
          rows=['AAA BBB GGG JJJ KKK QQQ', 'RRR SSS UUU 000 333 888',
                'SCENARIOS   ORBITX   VISUAL', 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                '0123456789']
          width=max(ImageDraw.Draw(Image.new('RGB',(1,1))).textbbox((0,0),s,font=font)[2] for s in rows)
          img=Image.new('RGB',(width+60,len(rows)*100+35),'white')
          d=ImageDraw.Draw(img)
          for idx,s in enumerate(rows):
              d.text((30,10+idx*100),s,font=font,fill='black')
          img.save(root/'OrbitX_Header_Font_P11_Preview.png')
          print('P11 verified: spacing unchanged; ONLY the requested uppercase/numerals modified.')
          print('P11 actual-font preview generated; Word rendering requires Windows test.')
          PY
      - name: Publish installable P11 TTF and actual-font preview
        uses: actions/upload-artifact@v4
        with:
          name: OrbitX-Header-Font-P11-TTF
          path: |
            tools/fonts/OrbitX_Header_Font_Prototype_11.ttf
            tools/fonts/OrbitX_Header_Font_P11_Preview.png
          if-no-files-found: error
