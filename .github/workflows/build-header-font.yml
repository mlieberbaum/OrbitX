name: Build OrbitX header font

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ui-polish-01
    paths:
      - .github/workflows/build-header-font.yml
      - tools/fonts/OrbitX_Header_Font_P10_Builder.py

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font-building dependencies
        run: |
          python -m pip install 'fonttools==4.59.2' 'pillow==11.3.0'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Check builder sources
        run: |
          test -f tools/fonts/OrbitX_Header_Font_Builder.py
          test -f tools/fonts/OrbitX_Header_Font_P8_Builder.py
          test -f tools/fonts/OrbitX_Header_Font_P10_Builder.py
      - name: Build OrbitX Header Font P10
        run: python tools/fonts/OrbitX_Header_Font_P10_Builder.py
      - name: Verify glyphs and reference audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from PIL import Image, ImageDraw, ImageFont
          directory=Path('tools/fonts')
          old=directory/'OrbitX_Header_Font_Prototype_8.ttf'
          new=directory/'OrbitX_Header_Font_Prototype_10.ttf'
          assert old.is_file() and new.is_file(), 'Missing expected font outputs'
          a,b=TTFont(old),TTFont(new)
          assert b['name'].getDebugName(1)=='OrbitX Header Font P10'
          assert b['OS/2'].fsType==0
          assert b['maxp'].numGlyphs>1000
          unchanged='AHIKMNTVWXYZ'
          changed='BCDEFGJLOPQRSU'
          for ch in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789':
              assert ord(ch) in b.getBestCmap(), f'Missing glyph: {ch}'
              g0,g1=a.getBestCmap()[ord(ch)],b.getBestCmap()[ord(ch)]
              assert a['hmtx'][g0]==b['hmtx'][g1], f'Spacing changed: {ch}'
              if ch in unchanged or ch.isdigit():
                  assert list(a['glyf'][g0].coordinates)==list(b['glyf'][g1].coordinates),f'Unexpected modification: {ch}'
          def ncurves(ch):
              glyph=b['glyf'][b.getBestCmap()[ord(ch)]]
              return sum((flag&1)==0 for flag in glyph.flags)
          for ch in changed:
              assert ncurves(ch)>0, f'Reference-rounded glyph lacks smooth Bézier contours: {ch}'
          assert ncurves('C') >= 4 and ncurves('E') >= 2, 'Missing rebuilt C/E curves'
          assert ncurves('M') == ncurves('N') == 0
          a.close();b.close()
          # Render the ACTUAL TrueType file, not a synthetic conceptual mockup.
          font=ImageFont.truetype(str(new),88)
          lines=['ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz',
                 'C C C    E E E    B D G O P Q R S U','ORBITX  SCENARIOS  VISUAL  EFFECTS']
          widths=[ImageDraw.Draw(Image.new('RGB',(10,10))).textbbox((0,0),line,font=font)[2] for line in lines]
          image=Image.new('RGB',(max(widths)+72,500),'#ffffff')
          draw=ImageDraw.Draw(image)
          for idx,line in enumerate(lines):
              draw.text((35,22+idx*112),line,font=font,fill='#111111')
          image.save(directory/'OrbitX_Header_Font_P10_Preview.png')
          print('P10 curves, glyph coverage, unchanged angular letters and ALL 62 metrics verified.')
          print('This is not an MS Word test; confirm appearance on Windows before approval.')
          PY
      - name: Publish Word-test font and actual-font preview
        uses: actions/upload-artifact@v4
        with:
          name: OrbitX-Header-Font-P10-TTF
          path: |
            tools/fonts/OrbitX_Header_Font_Prototype_10.ttf
            tools/fonts/OrbitX_Header_Font_P10_Preview.png
          if-no-files-found: error
